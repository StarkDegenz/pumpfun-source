name: PumpPortal capture duration
on:
  pull_request:
    paths:
      - scripts/pumpportal-capture.mjs
      - scripts/test_pumpportal_duration.mjs
      - .github/workflows/pumpportal-duration.yml
  push:
    paths:
      - scripts/pumpportal-capture.mjs
      - scripts/test_pumpportal_duration.mjs
      - .github/workflows/pumpportal-duration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-duration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test_pumpportal_duration.mjs
