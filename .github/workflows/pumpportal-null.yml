name: PumpPortal event retention
on:
  pull_request:
    paths:
      - scripts/pumpportal-capture.mjs
      - scripts/test_pumpportal_null.mjs
      - .github/workflows/pumpportal-null.yml
  push:
    paths:
      - scripts/pumpportal-capture.mjs
      - scripts/test_pumpportal_null.mjs
      - .github/workflows/pumpportal-null.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loopback-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test scripts/test_pumpportal_null.mjs
